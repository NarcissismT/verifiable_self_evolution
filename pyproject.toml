[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "verifiable-self-evolution"
version = "0.1.0"
description = "Verifier-gated self-evolution experiments for small open models"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
train = [
  "accelerate>=1.0",
  "bitsandbytes>=0.45",
  "datasets>=3.0",
  "peft>=0.14",
  "torch>=2.4",
  "transformers>=4.48",
  "trl>=0.13",
]
test = ["pytest>=8"]

[project.scripts]
vse = "vse.cli:main"

[tool.setuptools.packages.find]
include = ["vse*"]

